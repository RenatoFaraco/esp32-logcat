; esp32-logcat: PlatformIO only for the core's native tests, until #92 moves them to CMake.
; The firmware itself builds with ESP-IDF (ADR-013): cd examples/demo && idf.py build
;
; Tests:  pio test -e native

[platformio]
default_envs = native
; The core (components/esp32_logcat/core) is the library the tests link; port/ is ESP-IDF
; code and stays out (lib_ignore below).
lib_dir = components/esp32_logcat
test_dir = test

; Host build of the platform-independent core, unit-tested with Unity.
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_ignore = test_target_*  ; those run on the board (#93: an ESP-IDF test app)
lib_ignore = port
; logcat_demo (latency_stats), for test_latency_stats
lib_extra_dirs = examples/demo/components
build_flags =
    -Wall
    -Wextra
    -Werror
    -pthread  ; tests use std::thread; explicit for older glibc/clang
; -std=c++17 -fno-exceptions -fno-rtti (C++ sources only)
extra_scripts = pre:scripts/native_cxx_flags.py

; Core tests under sanitizers. CI only (Linux): MinGW on Windows has no ASan/TSan runtime.
; ASan + UBSan: out-of-bounds reads/writes and undefined behavior (e.g. an invalid bool).
[env:native_asan]
extends = env:native
custom_sanitizers = address,undefined

; TSan cannot share a binary with ASan. It checks the happens-before relation directly, which
; stress tests on x86 cannot prove (the CPU does not reorder stores).
[env:native_tsan]
extends = env:native
custom_sanitizers = thread
