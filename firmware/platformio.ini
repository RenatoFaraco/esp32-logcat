; esp32-logcat firmware
; Build:  pio run -e esp32c3
; Tests:  pio test -e native

[platformio]
default_envs = esp32c3

; Target: generic ESP32-C3 board (dual USB-C), ESP-IDF.
; C++ standard follows the ESP-IDF default here; strict C++17 is enforced on the core
; through env:native (ADR-005).
[env:esp32c3]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = espidf
; DIO: confirmed on the board (embedded 4 MB XMC flash); QIO untested (docs/hardware.md)
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Host build of the platform-independent core, unit-tested with Unity.
; Only used through `pio test`: src/ holds ESP-IDF code and is not built here.
[env:native]
platform = native @ 1.2.1
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -Werror
    -pthread  ; tests use std::thread; explicit for older glibc/clang
; -std=c++17 -fno-exceptions -fno-rtti (C++ sources only)
extra_scripts = pre:scripts/native_cxx_flags.py

; Core tests under sanitizers. CI only (Linux): MinGW on Windows has no ASan/TSan runtime.
; ASan + UBSan: out-of-bounds reads/writes and undefined behavior (e.g. an invalid bool).
[env:native_asan]
extends = env:native
custom_sanitizers = address,undefined

; TSan cannot share a binary with ASan. It checks the happens-before relation directly, which
; stress tests on x86 cannot prove (the CPU does not reorder stores).
[env:native_tsan]
extends = env:native
custom_sanitizers = thread
