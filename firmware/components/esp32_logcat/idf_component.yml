## The component's own dependencies, fetched by the ESP-IDF component manager.
dependencies:
  idf: ">=6.1"
  # LittleFS for the `logs` partition (#24): power-loss resilient, wear levelling.
  joltwallet/littlefs:
    # Exactly the version the on-board tests pass with (firmware/test/target). A newer one is a
    # deliberate change: update it here and in test/target/main/idf_component.yml, then run the
    # on-board tests again.
    version: "==1.23.1"
    require: private  # no public header of ours includes LittleFS
