name: "Task: hardware test / measurement"
description: A test or measurement on the board (acceptance criteria, timing, crash, power cut).
title: "test: "
labels: ["test", "needs-hardware"]
body:
  - type: input
    id: criterion
    attributes:
      label: Acceptance criterion or requirement
      placeholder: PRD §7 criterion 2 (power cut)
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Board, firmware commit, wiring, instruments (logic analyzer, USB-UART), host commands.
    validations:
      required: true

  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      placeholder: |
        1. Flash commit ...
        2. Start `esp-logcat stream --save run1.log`
        3. Cut USB power while logging 1000 lines/s; repeat 20 times
    validations:
      required: true

  - type: textarea
    id: pass
    attributes:
      label: Pass criteria
      description: Measurable thresholds.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Results and evidence
      description: Fill when executed — numbers, captures, logs. Attach files or link them.
