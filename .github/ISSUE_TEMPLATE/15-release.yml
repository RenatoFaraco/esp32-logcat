name: "Release checklist"
description: Prepare and publish a version (milestone close).
title: "release: v"
labels: ["release"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone(s) closed by this release
      placeholder: M1 · Core
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: All milestone issues closed or moved
        - label: CI green on main
        - label: CHANGELOG.md updated (Keep a Changelog) via PR
        - label: ROADMAP.md items checked
        - label: Version bumped where it lives (host `__version__`, firmware version)
        - label: Annotated tag created on the merge commit and pushed
        - label: GitHub Release published with notes from the CHANGELOG
        - label: Acceptance criteria evidence linked (v1.0.0 only)
