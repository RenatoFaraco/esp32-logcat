name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install tools
        run: pip install platformio==6.1.19 clang-format==23.1.3

      - name: Check C++ formatting
        run: git ls-files -- '*.cpp' '*.hpp' '*.h' | xargs -r clang-format --dry-run --Werror

      - name: Core unit tests (native)
        run: pio test -e native

      - name: Build target (esp32c3)
        run: pio run -e esp32c3

  firmware-sanitizers:
    # Out-of-bounds accesses, undefined behavior and data races only show up under sanitizers.
    # Linux only: MinGW on Windows has no ASan/TSan runtime. TSan cannot share a binary with ASan.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [native_asan, native_tsan]
    defaults:
      run:
        working-directory: firmware
    env:
      # Any report must end the program with an error so PlatformIO marks the test as failed.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install tools
        run: pip install platformio==6.1.19

      - name: Core unit tests (${{ matrix.env }})
        run: pio test -e ${{ matrix.env }}

  github-config:
    # Invalid issue forms are silently hidden by GitHub, so validate them here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install check-jsonschema==0.38.2

      - name: Validate issue forms, issue config and workflows
        run: |
          check-jsonschema --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/[0-9]*.yml
          check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest
