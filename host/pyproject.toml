[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "esp-logcat"
description = "adb logcat-style host tool for esp32-logcat firmware"
license = "MIT"
authors = [{ name = "Renato Faraco" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pyserial>=3.5",
    "rich>=13.7",
    "textual>=8.2,<9",  # the TUI only (ADR-008); breaking API changes between majors
    "prompt_toolkit>=3.0.43,<4",  # the shell prompt: log lines print above the line being typed
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # pinned: formatting output changes between releases; CI uses the same version
    "clang-format==23.1.3",
]

[project.scripts]
esp-logcat = "esp_logcat.cli:main"

[tool.hatch.version]
path = "src/esp_logcat/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN", "PLE2502"]  # PLE2502: bidi characters in source

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
